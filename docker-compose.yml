# Container-Logs begrenzen (enthalten u. a. Fehlermeldungen des Mailversands)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: kugelung
      POSTGRES_USER: kugelung
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kugelung"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    logging: *default-logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://kugelung:${DB_PASSWORD}@db:5432/kugelung
      SECRET_KEY: ${SECRET_KEY}
      BASE_URL: ${BASE_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      TEST_MODE_MAX_VOTERS: ${TEST_MODE_MAX_VOTERS:-3}
      TEST_MODE_DAILY_INVITATIONS: ${TEST_MODE_DAILY_INVITATIONS:-10}
      MAX_RECIPIENTS: ${MAX_RECIPIENTS:-500}
      MIN_VOTERS: ${MIN_VOTERS:-3}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      REMINDER_HOURS_BEFORE: ${REMINDER_HOURS_BEFORE:-24}
      MAIL_MIN_INTERVAL_SECONDS: ${MAIL_MIN_INTERVAL_SECONDS:-1}
      RATE_LIMIT_PER_EMAIL: ${RATE_LIMIT_PER_EMAIL:-5}
      RATE_LIMIT_PER_IP: ${RATE_LIMIT_PER_IP:-20}
      # IP des Reverse-Proxys, dem X-Forwarded-For vertraut wird
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Impressum / Datenschutz
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_STREET: ${LEGAL_STREET:-}
      LEGAL_CITY: ${LEGAL_CITY:-}
      LEGAL_COUNTRY: ${LEGAL_COUNTRY:-Deutschland}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_VAT_ID: ${LEGAL_VAT_ID:-}
      LEGAL_HOSTING: ${LEGAL_HOSTING:-}
      REPO_URL: ${REPO_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    ports:
      # Standard nur lokal erreichbar. Für einen Reverse-Proxy auf einem anderen Host
      # oder in einem Container ohne gemeinsames Netz: APP_BIND=0.0.0.0 (dann Firewall!).
      - "${APP_BIND:-127.0.0.1}:8000:8000"

volumes:
  db_data:
