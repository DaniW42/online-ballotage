name: tests
# Pushes auf main testet der image-Workflow; hier nur Pull Requests und andere Branches
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-password
      SECRET_KEY: ci-secret-key-0123456789abcdefghijklmnop
      BASE_URL: http://testserver
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm --build test
