{% extends "base.html" %}
{% block title %}{{ t('vote.meta_title') }}{% endblock %}
{% block robots %}noindex,nofollow{% endblock %}
{% block content %}
<h1>{{ election.title }}</h1>
<p>{{ t('vote.intro') }}</p>

<form method="post" action="/v/{{ token }}" class="card-form">
  <fieldset class="choices">
    <legend>{{ t('vote.choose') }}</legend>
    {% for option in election.options %}
    <label class="check"><input type="radio" name="choice" value="{{ option }}" required><span>{{ option }}</span></label>
    {% endfor %}
  </fieldset>
  <div class="actions"><button type="submit">{{ t('vote.submit') }}</button></div>
</form>
{% endblock %}
